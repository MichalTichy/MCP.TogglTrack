services:
  toggl-mcp:
    image: registry.tichymichal.net/mcp-toggl-track:latest
    build: .
    restart: unless-stopped
    environment:
      TOGGL_TRACK_API_KEY: "${TOGGL_TRACK_API_KEY:?Set TOGGL_TRACK_API_KEY}"
      TOGGL_TRACK_ORGANIZATION_ID: "${TOGGL_TRACK_ORGANIZATION_ID:-}"
      TOGGL_TRACK_WORKSPACE_ID: "${TOGGL_TRACK_WORKSPACE_ID:?Set TOGGL_TRACK_WORKSPACE_ID}"
      TOGGL_TRACK_API_MODE: "${TOGGL_TRACK_API_MODE:-auto}"
      TOGGL_TRACK_BASE_URL: "${TOGGL_TRACK_BASE_URL:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
